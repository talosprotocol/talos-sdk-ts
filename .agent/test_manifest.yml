repo_id: "sdks-typescript"
repo_root: "." 
commands:
  test_entrypoint: "scripts/test.sh"
coverage:
  enabled: false  # TODO: Enable when coverage reports are generated
  format: "cobertura"
  report_path: "artifacts/coverage/cobertura-coverage.xml"
  thresholds:
    line: 0.75
    branch: 0.50
  path_thresholds:
    "packages/sdk/src/crypto/**": { line: 0.90 }
ci:
  default: ["--smoke", "--unit", "--coverage"]
